<style id="gfl-style">
/* Layout: Timing-Tower. Dunkles Kopfband mit schrägen Reitern (Neigung wie im GFL-Logo), Filterleisten, breite Ergebnis-Matrix mit festen Fahrerspalten */
:root{
  --bg:#0D0E11; --panel:#15171C; --panel-2:#1C1F26; --line:#2A2E38; --fg:#ECEDF0; --muted:#8E95A2; --dim:#4A505C;
  --red:#E10600; --gold:#FFCC00;
  --p1:#F3C744; --p2:#C7CCD4; --p3:#C98552; --pts:#243040; --dnf:#5A1717; --dnf-fg:#FF9A90;
  --fl:#B23CF0; --pole:#2EC8E8; --ok:#3DDC84; --hover:#1B1E25;
  --f-display:"Saira Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.loading{max-width:1280px;margin:0 auto;padding:48px 16px;color:var(--muted);text-align:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0A0B0D}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.tabs a{transition:background-color .12s,border-color .12s}}

/* Kopfband */
.top{background:#0A0B0D;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--red) 0 78%,var(--bg) 78% 79%,var(--gold) 79% 86%,var(--bg) 86%)}
.top-in{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 19px;display:flex;align-items:center;justify-content:space-between;gap:16px 28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.logo{height:30px;width:auto;display:block}
.brand-sub{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:14px;color:var(--muted);padding-left:14px;border-left:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-left:6px}
.tabs a{display:inline-block;padding:7px 16px;transform:skewX(-20deg);background:var(--panel-2);text-decoration:none;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:15px;position:relative}
.tabs a>span{display:inline-block;transform:skewX(20deg)}
.tabs a:hover{background:#2A2E38}
.tabs a[aria-current="page"]{background:var(--red);color:#fff}
.tabs .dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--gold)}

/* Seitenrahmen */
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 110px;display:flex;flex-direction:column;gap:20px}
.foot{border-top:1px solid var(--line)}
.foot-in{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;align-items:center}
.foot-soc{display:inline-flex;gap:8px;margin-left:12px;vertical-align:middle}
.foot-soc a{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:4px;background:var(--panel-2)}
.foot-soc a:hover{background:var(--sc)}
.foot-soc svg{width:16px;height:16px;fill:var(--muted)}
.foot-soc a:hover svg{fill:#fff}

/* Socials: Karten mit schrägem Icon-Block wie die Reiter */
.soc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.soc{display:flex;align-items:center;gap:18px;padding:18px 20px 18px 22px;background:var(--panel);border:1px solid var(--line);border-radius:6px;text-decoration:none;position:relative;overflow:hidden;min-width:0}
.soc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc)}
.soc:hover{background:var(--hover);border-color:var(--sc)}
.soc-ic{flex:none;width:56px;height:56px;display:grid;place-items:center;background:var(--sc);transform:skewX(-20deg);border-radius:3px}
.soc-ic svg{width:30px;height:30px;fill:#fff;transform:skewX(20deg)}
.soc-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.soc-tx b{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.05em;line-height:1.1}
.soc-tx span{color:var(--muted);font-size:14px}
.soc-tx small{color:var(--fg);font-size:13px;font-weight:600;overflow-wrap:anywhere}
.soc-go{margin-left:auto;flex:none;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;padding:7px 14px;transform:skewX(-20deg);background:var(--panel-2)}
.soc-go>span{display:inline-block;transform:skewX(20deg)}
.soc:hover .soc-go{background:var(--sc);color:#fff}
@media (max-width:520px){.soc-go{display:none}}
@media (prefers-reduced-motion:no-preference){.soc,.soc-go,.foot-soc a{transition:background-color .12s,border-color .12s}}

/* Filter */
.filters{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:10px}
.frow{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:start}
.flab{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:13px;padding-top:6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);font-size:14px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:#4A505C}
.chip[aria-pressed="true"]{background:var(--fg);color:#111318;border-color:var(--fg)}
.chip.add{border-style:dashed;background:transparent;color:var(--muted)}
.chip small{font-size:11px;color:var(--muted);font-weight:600}
.chip[aria-pressed="true"] small{color:#555B66}
.tag{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:3px;background:rgba(255,204,0,.16);color:var(--gold)}
.chip[aria-pressed="true"] .tag{background:#5B4A00;color:#FFE27A}
@media (max-width:640px){.frow{grid-template-columns:minmax(0,1fr);gap:6px}.flab{padding-top:0}}

/* Überschriften */
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-weight:800;font-size:32px;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 12px}
.meta{color:var(--muted);margin:6px 0 0;font-size:14px}
.eyebrow{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted);align-items:center}
.legend>span{display:inline-flex;gap:7px;align-items:center}
.legend .cell{min-width:26px;height:20px;font-size:11px}

/* Tabellen */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
thead th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;color:var(--muted);font-weight:700;background:var(--panel-2)}
tbody tr:hover td{background:var(--hover)}
.mx td.c,.mx th.c{text-align:center;padding:8px 3px;min-width:46px}
.sx0{position:sticky;left:0;z-index:1;background:var(--panel);width:48px;min-width:48px;text-align:center}
.sx1{position:sticky;left:48px;z-index:1;background:var(--panel);box-shadow:inset -1px 0 0 var(--line)}
thead .sx0,thead .sx1{background:var(--panel-2);z-index:2}
tr.st th,tr.st td{background:var(--panel-2);border-bottom:1px solid #23262E;padding-block:4px;font-size:12.5px;color:var(--muted)}
tr.st th.sl{text-align:right;font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
tr.st td{text-align:center}
.pos{font-family:var(--f-display);font-weight:700;font-size:17px}
.drv{font-weight:600}
.num{text-align:right}
.total{font-weight:700;font-size:15px}
.muted{color:var(--muted)}
.tm{display:inline-flex;align-items:center;gap:8px}
.tm i{width:4px;height:16px;border-radius:2px;display:inline-block;flex:none}
.sub{display:block;color:var(--muted);font-size:12.5px;font-weight:400}

.rh{display:inline-flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:2px 4px;border-radius:4px;color:var(--muted)}
.rh:hover{background:#2A2E38;color:var(--fg)}
.rh b{font-size:11.5px;letter-spacing:.06em;color:var(--fg)}
.rh small{font-size:10.5px}

.flag{display:inline-block;width:21px;height:14px;border-radius:2px;outline:1px solid rgba(255,255,255,.14);outline-offset:-1px;flex:none;vertical-align:middle}
.flag.big{width:60px;height:40px;border-radius:4px}
.flag-x{background:#2A2E38;color:var(--muted);font-size:8px;font-weight:700;line-height:14px;text-align:center}
.wx{width:20px;height:20px;display:inline-block;vertical-align:middle}

/* Ergebnis-Zellen */
.cell{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:26px;padding:0 4px;border-radius:4px;font-weight:600;font-size:13.5px}
.cell.p1{background:var(--p1);color:#241A00}
.cell.p2{background:var(--p2);color:#14161A}
.cell.p3{background:var(--p3);color:#1F0F04}
.cell.pz{background:var(--pts);color:var(--fg)}
.cell.out{color:var(--muted)}
.cell.dnf{background:var(--dnf);color:var(--dnf-fg);font-size:11px;letter-spacing:.04em}
.cell.dsq{background:#000;color:#fff;font-size:11px;box-shadow:inset 0 0 0 1px #555}
.cell.dns{color:var(--muted);font-size:11px}
.cell.na{color:var(--dim)}
.cell.tp{min-width:36px}
.cell.fl{box-shadow:0 0 0 2px var(--fl)}
.cell.pole::after{content:"";position:absolute;left:4px;right:4px;bottom:-6px;height:3px;border-radius:2px;background:var(--pole)}
.cell.dotd::before{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--panel)}

/* Einzelrennen */
.race-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px 20px;align-items:center}
@media (max-width:640px){.race-head{grid-template-columns:auto minmax(0,1fr)}.rnav{grid-column:1/-1}}
.rnav{display:flex;gap:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.fact .v{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fact .t{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;font-size:14px}
.fact.fl{border-color:rgba(178,60,240,.55)}
.fact.pole{border-color:rgba(46,200,232,.5)}
.fact.dotd{border-color:rgba(255,204,0,.45)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:3px;text-transform:uppercase}
.badge.fl{background:rgba(178,60,240,.18);color:#D9A2FA}
.badge.pole{background:rgba(46,200,232,.15);color:#8FE3F4}
.badge.dotd{background:rgba(255,204,0,.14);color:#FFE27A}
.badge.ot{background:rgba(61,220,132,.15);color:#8FF0BC}
.badge.clean{background:rgba(236,237,240,.12);color:var(--fg)}
.fact.ot{border-color:rgba(61,220,132,.45)}
.fact.clean{border-color:rgba(236,237,240,.35)}
.badge.next{background:var(--red);color:#fff}
td.flt{color:#D9A2FA;font-weight:700}
.tin{width:7.5em}
.badge.open{background:var(--panel-2);color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap}

/* Hinweise und leere Zustände */
.banner{border:1px dashed rgba(255,204,0,.6);color:#FFE27A;background:rgba(255,204,0,.06);padding:10px 14px;border-radius:6px;font-size:14px}
.banner.info{border:1px solid var(--line);color:var(--fg);background:var(--panel)}
.banner .btn{margin-left:6px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:6px}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* Verwaltung */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>p{margin:0;color:var(--muted);font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);min-width:0}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg)}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;font:inherit;font-size:14px;min-width:0;max-width:100%}
input[type="color"]{padding:2px;width:42px;height:34px;flex:none}
input[type="checkbox"],input[type="radio"]{width:17px;height:17px;accent-color:var(--red);padding:0}
textarea{width:100%;min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
select:disabled{opacity:.4}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#4A505C}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#C00500}
.btn.danger{color:#FF9A90;border-color:#5A2A2A;background:transparent}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.erows{display:flex;flex-direction:column;gap:8px}
.erow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.erow input[type="text"]{flex:1 1 170px}
.erow select{flex:0 1 190px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.warn{color:var(--gold);font-size:13.5px;margin:0}
.ok{color:var(--ok)}
.rlist td{padding-block:6px}
.rlist tr.sel td{background:#22252D}
.res td{padding-block:5px}
.res td.c{text-align:center}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:#FF9A90}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0A0B0D;border-top:2px solid var(--red);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar-in{max-width:1280px;margin:0 auto;display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.savebar p{margin:0;font-size:14px}

/* Logo im Kopf */
.emblem{width:58px;height:58px;display:block;flex:none;filter:drop-shadow(0 2px 8px rgba(0,0,0,.7))}
.brand-name{display:flex;flex-direction:column;gap:3px;line-height:1}
.brand-name b{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:.04em;text-transform:uppercase}
.brand-name span{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
@media (max-width:420px){.brand-name b{font-size:18px}.emblem{width:48px;height:48px}}

/* Überblendung beim Wechseln der Ansicht */
@media (prefers-reduced-motion:no-preference){
  main.enter{animation:gflIn .28s ease-out both}
  @keyframes gflIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  ::view-transition-old(root){animation-duration:.18s}
  ::view-transition-new(root){animation-duration:.28s}
}

/* Kalender nach Rennwochenenden */
tr.wk td{background:var(--panel-2);font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:12.5px;color:var(--gold);padding-block:6px}
.slot{font-family:var(--f-display);font-weight:800;font-size:13px;padding:2px 6px;border-radius:3px;background:rgba(255,204,0,.14);color:#FFE27A}

/* Fahrer */
.dsec{display:flex;flex-direction:column;gap:12px}
.dsec>h3{margin:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,470px),1fr));gap:16px}
.tblock{display:flex;flex-direction:column;gap:8px;min-width:0}
.tblock .tname{margin:0;font-weight:700;font-size:15px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr));gap:10px}
.dcard{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dcard h4{margin:0;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.dcard .sub{margin-top:2px}
.dc-pos{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;color:var(--muted)}
.dc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;margin:0}
.dc-stats dt{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dc-stats dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.dc-rate{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-weight:600;font-size:13.5px;color:var(--fg);text-align:left}
.dc-rate:hover{border-color:var(--muted)}
.dc-rate b{font-variant-numeric:tabular-nums}

/* Bewertung */
.tier{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:4px;font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1;vertical-align:middle}
.tier.big{width:52px;height:52px;font-size:32px;border-radius:6px;flex:none}
.tier.tS{background:rgba(243,199,68,.18);color:#F3C744;box-shadow:inset 0 0 0 1px rgba(243,199,68,.55)}
.tier.tA{background:rgba(46,200,232,.15);color:#8FE3F4;box-shadow:inset 0 0 0 1px rgba(46,200,232,.45)}
.tier.tB{background:rgba(61,220,132,.13);color:#8FF0BC;box-shadow:inset 0 0 0 1px rgba(61,220,132,.4)}
.tier.tC{background:rgba(255,154,80,.13);color:#FFB27A;box-shadow:inset 0 0 0 1px rgba(255,154,80,.4)}

function teamRows(s){
  var races=sortedRaces(s).filter(done),map={},order=[];
  function get(id){if(!map[id]){var c=[];for(var k=0;k<40;k++)c.push(0);map[id]={id:id,total:0,per:{},cnt:c,names:{}};order.push(id);}return map[id];}
  s.teams.forEach(function(t){get(t.id);});
  s.drivers.forEach(function(d){if(d.active!==false&&d.team)get(d.team).names[d.id]=1;});
  races.forEach(function(r){r.results.forEach(function(x){
    var row=get(x.t||''),p=pts(s,r,x.d);
    row.total+=p;row.per[r.id]=(row.per[r.id]||0)+p;row.names[x.d]=1;
    if(!x.s&&x.p)row.cnt[x.p-1]++;
  });});
  var rows=order.map(function(id){return map[id];}).filter(function(r){return Object.keys(r.names).length>0;});
  rows.sort(function(a,b){return b.total-a.total||cmpCnt(a.cnt,b.cnt);});
  rank(rows,function(a,b){return a.total===b.total&&cmpCnt(a.cnt,b.cnt)===0;});
  return rows;
}
function raceOrder(r){
  var o={'':0,DNF:1,DSQ:2,DNS:3};
  return r.results.slice().sort(function(a,b){return (o[a.s||'']-o[b.s||''])||((a.p||99)-(b.p||99));});
}
function parseT(t){
  if(!t)return 0;var m=String(t).trim().match(/^(?:(\d+):)?(\d{1,2})[.,](\d{1,3})$/);
  if(!m)return 0;return (+(m[1]||0))*60000+(+m[2])*1000+(+(m[3]+'00').slice(0,3));
}
function fmtDate(d,long){
  if(!d)return 'Datum offen';
  var dt=new Date(d+'T12:00:00');if(isNaN(dt))return d;
  return dt.toLocaleDateString('de-DE',long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
}
function today(){var t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function defaultSeason(){
  for(var i=0;i<draft.seasons.length;i++){if(!draft.seasons[i].demo)return draft.seasons[i].id;}
  return draft.seasons[0]?draft.seasons[0].id:null;
}
/* Rennbezeichnung: Wochenende und R1/R2, sonst laufende Nummer */
function rLabel(r,i){return r.slot?(r.weekend?'WE'+r.weekend+' ':'')+r.slot:'R'+(i+1);}
function dLabel(r,long){return r.dateLabel?r.dateLabel:fmtDate(r.date,long);}
function pointsText(s){
  var t=s.points.join(' · ');
  if(+s.flPoint) t+=' · +'+s.flPoint+' für die schnellste Runde'+(s.flTop10?' (nur Top 10)':'');
  if(+s.polePoint) t+=' · +'+s.polePoint+' für die Pole';
  if(+s.cleanPoint) t+=' · +'+s.cleanPoint+' für den saubersten Fahrer';
  if(+s.otPoint) t+=' · +'+s.otPoint+' für die meisten Überholungen';
  if(+s.attendPoint) t+=' · +'+s.attendPoint+' fürs Dabeibleiben bis Rennende';
  return t;
}

/* ---------- Matrix ---------- */
function statRows(races,fixed){
  function row(label,fn){
    return '<tr class="st"><th class="sl sx0" colspan="1"></th><th class="sl sx1">'+label+'</th>'+(fixed>2?'<td colspan="'+(fixed-2)+'"></td>':'')+
      races.map(function(r){return '<td>'+(done(r)?fn(r):'<span class="muted">·</span>')+'</td>';}).join('')+'</tr>';
  }
  function starters(r){return r.results.filter(function(x){return x.s!=='DNS';}).length;}
  function dnfs(r){return r.results.filter(function(x){return x.s==='DNF';}).length;}
  return row('Teilnehmer',starters)+row('Ausfälle',dnfs)+
    row('Ausfallquote',function(r){var n=starters(r);return n?Math.round(dnfs(r)/n*100)+'%':'–';})+
    '<tr class="st"><th class="sl sx0"></th><th class="sl sx1">Wetter</th>'+(fixed>2?'<td colspan="'+(fixed-2)+'"></td>':'')+races.map(function(r){return '<td>'+wx(r.weather)+'</td>';}).join('')+'</tr>';
}
function raceHeads(races){
  return races.map(function(r,i){
    return '<th class="c"><button class="rh" data-act="race" data-id="'+esc(r.id)+'" title="'+esc(r.name)+' ansehen">'+flag(r.flag)+'<b>'+esc(r.short||'R'+(i+1))+'</b><small>'+esc(rLabel(r,i))+'</small></button></th>';
  }).join('');
}
function posCell(s,r,d){
  if(!done(r)) return '<span class="cell na">·</span>';
  var x=resOf(r,d);if(!x) return '<span class="cell na" title="Nicht teilgenommen">–</span>';
  var cls,txt,tip=[r.short||r.name];
  if(x.s){cls=x.s.toLowerCase();txt=x.s;tip.push(x.s);}
  else{txt=x.p;cls=x.p<=3?'p'+x.p:(+s.points[x.p-1]?'pz':'out');tip.push('P'+x.p);}
  var p=pts(s,r,d);tip.push(p+' Pkt');
  if(r.pole===d){cls+=' pole';tip.push('Pole'+(r.poleTime?' '+r.poleTime:''));}
  if(r.fl===d){cls+=' fl';tip.push('Fastest Lap'+(r.flTime?' '+r.flTime:''));}
  if(r.dotd===d){cls+=' dotd';tip.push('Driver of the Day');}
  if(r.ot===d)tip.push('Meiste Überholungen');
  if(r.clean===d)tip.push('Sauberster Fahrer');
  if(x.a)tip.push('bis Rennende dabei');
  return '<span class="cell '+cls+'" title="'+esc(tip.join(' · '))+'">'+esc(txt)+'</span>';
}
function viewDrivers(s){
  var races=sortedRaces(s),rows=driverRows(s),lead=rows.length?rows[0].total:0,anyDone=races.some(done);
  if(!rows.length) return emptyBox('Noch keine Fahrer','Lege in der Verwaltung Fahrer und Teams an.');
  var h='<div class="tbl-wrap"><table class="mx"><thead>'+statRows(races,6)+
    '<tr><th class="sx0">Pos</th><th class="sx1">Fahrer</th><th>Team</th><th class="num">Punkte</th><th class="num">Diff.</th><th class="num" title="Schnellste Runden">FL</th>'+raceHeads(races)+'</tr></thead><tbody>';
  rows.forEach(function(row){
    var d=drv(s,row.id);
    h+='<tr><td class="sx0 pos">'+(anyDone?row.pos:'–')+'</td><td class="sx1 drv">'+(d&&d.nat?flag(d.nat)+' ':'')+dLink(s,row.id,ui.race)+'</td><td>'+tmTag(curTeam(s,row.id))+'</td>'+
      '<td class="num total">'+row.total+'</td><td class="num muted">'+(row.total===lead?'—':'−'+(lead-row.total))+'</td><td class="num">'+(row.fls||'<span class="muted">0</span>')+'</td>'+
      races.map(function(r){return '<td class="c">'+posCell(s,r,row.id)+'</td>';}).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function viewTeams(s){
  var races=sortedRaces(s),rows=teamRows(s),lead=rows.length?rows[0].total:0;
  if(!rows.length) return emptyBox('Noch keine Teams mit Fahrern','Ordne in der Verwaltung den Fahrern ihre Teams zu.');
  var h='<div class="tbl-wrap"><table class="mx"><thead>'+statRows(races,5)+
    '<tr><th class="sx0">Pos</th><th class="sx1">Team</th><th>Fahrer</th><th class="num">Punkte</th><th class="num">Diff.</th>'+raceHeads(races)+'</tr></thead><tbody>';
  rows.forEach(function(row){
    var t=team(s,row.id)||{name:row.id?'Gelöschtes Team':'Ohne Team',color:'#4A505C'};
    var names=Object.keys(row.names).map(function(id){return dName(s,id);}).join(', ');
    h+='<tr><td class="sx0 pos">'+(races.some(done)?row.pos:'–')+'</td><td class="sx1 drv">'+tmTag(t)+'</td><td class="muted">'+esc(names)+'</td>'+
      '<td class="num total">'+row.total+'</td><td class="num muted">'+(row.total===lead?'—':'−'+(lead-row.total))+'</td>'+
      races.map(function(r){
        if(!done(r))return '<td class="c"><span class="cell na">·</span></td>';
        if(!(r.id in row.per))return '<td class="c"><span class="cell na">–</span></td>';
        var p=row.per[r.id];return '<td class="c"><span class="cell tp '+(p>0?'pz':'out')+'" title="'+esc((r.short||r.name)+': '+p+' Pkt')+'">'+p+'</span></td>';
      }).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function viewCount(s,cat){
  var races=sortedRaces(s),done_=races.filter(done);
  var rows=driverRows(s).map(function(b){
    var n=done_.filter(function(r){return cat.test(r,resOf(r,b.id),b.id);}).length;
    return {id:b.id,total:b.total,n:n};
  }).filter(function(r){return r.n>0;});
  if(!rows.length) return emptyBox('Noch keine Einträge','Für „'+cat.label+'“ gibt es in dieser Saison noch nichts zu zeigen.');
  rows.sort(function(a,b){return b.n-a.n||b.total-a.total;});
  rank(rows,function(a,b){return a.n===b.n;});
  var h='<div class="tbl-wrap"><table class="mx"><thead>'+statRows(races,4)+
    '<tr><th class="sx0">Pos</th><th class="sx1">Fahrer</th><th>Team</th><th class="num">Anzahl</th>'+raceHeads(races)+'</tr></thead><tbody>';
  rows.forEach(function(row){
    var d=drv(s,row.id);
    h+='<tr><td class="sx0 pos">'+row.pos+'</td><td class="sx1 drv">'+(d&&d.nat?flag(d.nat)+' ':'')+dLink(s,row.id,ui.race)+'</td><td>'+tmTag(curTeam(s,row.id))+'</td><td class="num total">'+row.n+'</td>'+
      races.map(function(r){
        if(!done(r))return '<td class="c"><span class="cell na">·</span></td>';
        return '<td class="c">'+(cat.test(r,resOf(r,row.id),row.id)?posCell(s,r,row.id):'<span class="cell na"></span>')+'</td>';
      }).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}

function viewRace(s,r){
  var races=sortedRaces(s),idx=races.indexOf(r),prev=races[idx-1],next=races[idx+1];
  var h='<section class="race-head">'+(flag(r.flag,'big')||'<span></span>')+
    '<div><p class="eyebrow">Rennen '+(idx+1)+' von '+races.length+(r.slot?' · '+(r.weekend?'Rennwochenende '+esc(r.weekend)+', ':'')+esc(r.slot):'')+' · '+esc(s.name)+'</p><h2>'+esc(r.name)+'</h2>'+
    '<p class="meta">'+[esc(r.track),esc(dLabel(r,true)),r.time?esc(r.time)+' Uhr':'',r.laps?esc(r.laps)+' Runden':''].filter(Boolean).join(' · ')+' '+wx(r.weather)+'</p></div>'+
    '<div class="rnav">'+(prev?'<button class="btn small" data-act="race" data-id="'+esc(prev.id)+'">← '+esc(prev.short||'Zurück')+'</button>':'')+
    (next?'<button class="btn small" data-act="race" data-id="'+esc(next.id)+'">'+esc(next.short||'Weiter')+' →</button>':'')+'</div></section>';
  var sess=ui.sess==='quali'?'quali':'rennen';
  h+='<div class="chips" role="group" aria-label="Session">'+[['rennen','Rennen'],['quali','Qualifying']].map(function(o){return '<button class="chip" data-act="sess" data-id="'+o[0]+'" aria-pressed="'+(sess===o[0])+'">'+o[1]+'</button>';}).join('')+'</div>';
  if(sess==='quali') return h+viewQuali(s,r);
  if(!done(r)) return h+emptyBox('Noch nicht gefahren','Geplant für '+dLabel(r,true)+(r.time?', '+r.time+' Uhr':'')+'.');
  var order=raceOrder(r),win=order[0];
  var hasTm=r.results.some(function(x){return x.tm;}),hasBl=r.results.some(function(x){return x.bl;});
  function fact(cls,label,d,t){
    return '<div class="fact '+cls+'"><p class="eyebrow">'+label+'</p><div class="v">'+(d?esc(dName(s,d)):'<span class="muted">nicht eingetragen</span>')+(t?' <span class="t">'+esc(t)+'</span>':'')+'</div></div>';
  }
  h+='<section class="facts">'+fact('win','Sieger',win&&!win.s?win.d:null)+fact('pole','Pole-Position',r.pole,r.poleTime)+fact('fl','Schnellste Runde',r.fl,r.flTime)+fact('dotd','Driver of the Day',r.dotd)+fact('ot','Meiste Überholungen',r.ot)+fact('clean','Sauberster Fahrer',r.clean)+'</section>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>Pos</th><th>Fahrer</th><th>Team</th>'+(hasTm?'<th class="num">Zeit / Abstand</th>':'')+(hasBl?'<th class="num">Beste Runde</th>':'')+'<th class="num">Punkte</th><th>Auszeichnungen</th></tr></thead><tbody>';
  order.forEach(function(x){
    var d=drv(s,x.d),t=team(s,x.t)||{name:'Ohne Team',color:'#4A505C'},b=[];
    if(r.pole===x.d)b.push('<span class="badge pole">Pole</span>');
    if(r.fl===x.d)b.push('<span class="badge fl">Fastest Lap</span>');
    if(r.dotd===x.d)b.push('<span class="badge dotd">Driver of the Day</span>');
    if(r.ot===x.d)b.push('<span class="badge ot">Meiste Überholungen</span>');
    if(r.clean===x.d)b.push('<span class="badge clean">Sauberster Fahrer</span>');
    h+='<tr><td>'+posCell(s,r,x.d)+'</td><td class="drv">'+(d&&d.nat?flag(d.nat)+' ':'')+dLink(s,x.d,r.id)+'</td><td>'+tmTag(t)+'</td>'+(hasTm?'<td class="num">'+esc(x.tm||'')+'</td>':'')+(hasBl?'<td class="num'+(r.fl===x.d?' flt':'')+'">'+esc(x.bl||'')+'</td>':'')+'<td class="num total">'+pts(s,r,x.d)+'</td><td><div class="badges">'+b.join('')+'</div></td></tr>';
  });
  return h+'</tbody></table></div>';
}
function fmtGap(ms){
  var s=ms/1000;if(s<60)return '+'+s.toFixed(3);
  var m=Math.floor(s/60);return '+'+m+':'+(s-m*60).toFixed(3).padStart(6,'0');
}
function qTeam(s,r,d){var x=resOf(r,d),dd=drv(s,d);return team(s,x?x.t:(dd?dd.team:''))||{name:'Ohne Team',color:'#4A505C'};}
function viewQuali(s,r){
  var q=(r.quali||[]).filter(function(x){return x.p;}).sort(function(a,b){return a.p-b.p;});
  if(!q.length) return emptyBox('Noch kein Qualifying eingetragen',r.pole?'Pole: '+dName(s,r.pole)+(r.poleTime?' in '+r.poleTime:'')+'.':'Die Zeiten kommen nach dem Qualifying in die Verwaltung.');
  var best=parseT(q[0].tm);
  var h='<div class="tbl-wrap"><table><thead><tr><th>Pos</th><th>Fahrer</th><th>Team</th><th class="num">Rundenzeit</th><th class="num">Abstand</th></tr></thead><tbody>';
  q.forEach(function(x){
    var d=drv(s,x.d),ms=parseT(x.tm),cls=x.p<=3?'p'+x.p:'out';
    h+='<tr><td><span class="cell '+cls+'">'+x.p+'</span></td><td class="drv">'+(d&&d.nat?flag(d.nat)+' ':'')+dLink(s,x.d,r.id)+'</td><td>'+tmTag(qTeam(s,r,x.d))+'</td>'+
      '<td class="num total">'+esc(x.tm||'–')+'</td><td class="num muted">'+(x.p===1?'Pole':(ms&&best?fmtGap(ms-best):''))+'</td></tr>';
  });

function collectRecords(list){
  var map={},keys=[];
  list.forEach(function(s){s.races.forEach(function(r){
    if(!done(r)&&!(r.quali||[]).length)return;
    var key=r.track||r.name;
    if(!map[key]){map[key]={track:key,name:r.name,flag:r.flag,q:null,rl:null};keys.push(key);}
    var m=map[key],ms;
    if(r.pole&&r.poleTime&&(ms=parseT(r.poleTime))&&(!m.q||ms<m.q.ms)){var xq=resOf(r,r.pole);m.q={ms:ms,time:r.poleTime,d:dName(s,r.pole),t:team(s,xq&&xq.t),s:s};}
    if(r.fl&&r.flTime&&(ms=parseT(r.flTime))&&(!m.rl||ms<m.rl.ms)){var xr=resOf(r,r.fl);m.rl={ms:ms,time:r.flTime,d:dName(s,r.fl),t:team(s,xr&&xr.t),s:s};}
    (r.quali||[]).forEach(function(x){var t=parseT(x.tm);if(t&&(!m.q||t<m.q.ms))m.q={ms:t,time:x.tm,d:dName(s,x.d),t:qTeam(s,r,x.d),s:s};});
    r.results.forEach(function(x){var t=parseT(x.bl);if(t&&(!m.rl||t<m.rl.ms))m.rl={ms:t,time:x.bl,d:dName(s,x.d),t:team(s,x.t),s:s};});
  });});
  return keys.map(function(k){return map[k];}).filter(function(m){return m.q||m.rl;}).sort(function(a,b){return a.name.localeCompare(b.name,'de');});
}
function driverStats(s){
  var races=sortedRaces(s).filter(done),map={};
  driverRows(s).forEach(function(r){

    for(var k=0;k<r.cnt.length;k++){if(r.cnt[k]){st.best=k+1;break;}}
    races.forEach(function(x){if(x.pole===r.id)st.poles++;});

  });

}

var TIERS={S:'Elite',A:'Spitze',B:'Mittelfeld',C:'Ausbaufähig',D:'Einsteiger'};
var RK=['tempo','rv','kon','sau'];
function realSeasons(){return draft.seasons.filter(function(x){return !x.demo;});}
function rateSeason(){return S(ui.rSeason)||realSeasons()[0]||S(ui.season);}
function rateTier(v){var l=(RATE&&RATE.niveaus)||[];for(var i=0;i<l.length;i++)if(v>=l[i].ab)return l[i].t;return 'D';}
function rateEntries(f,sid,rid){return (f.rennen||[]).filter(function(e){return (!sid||sid==='all'||e.s===sid)&&(!rid||rid==='all'||e.r===rid);});}
function rateScore(f,sid,rid){
  var es=rateEntries(f,sid,rid);if(!es.length)return null;
  var o={id:f.id,f:f,n:es.length,e:es.length===1?es[0]:null};
  RK.forEach(function(k){var t=0;es.forEach(function(e){t+=+e[k]||0;});o[k]=Math.round(t/es.length);});
  o.total=o.tempo+o.rv+o.kon+o.sau;o.tier=rateTier(o.tempo+o.rv);return o;
}
function rateList(sid,rid){
  if(!RATE||!RATE.fahrer)return [];
  var ord='SABCD';
  return RATE.fahrer.map(function(f){return rateScore(f,sid,rid);}).filter(Boolean)
    .sort(function(a,b){return ord.indexOf(a.tier)-ord.indexOf(b.tier)||b.total-a.total;});
}
function rateF(id){var l=(RATE&&RATE.fahrer)||[];for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}
function rateOf(id,sid,rid){var f=rateF(id);return f?rateScore(f,sid,rid):null;}
function tierBadge(t,big){return '<span class="tier t'+t+(big?' big':'')+'" title="Niveau '+t+' · '+(TIERS[t]||'')+'">'+t+'</span>';}
function rateBtn(id){var f=rateOf(id,'all','all');return f?'<button class="dc-rate" data-act="rateGo" data-id="'+esc(id)+'"><span>Bewertung ansehen</span><span>'+tierBadge(f.tier)+' <b>'+f.total+'</b></span></button>':'';}

function rateGeneral(s,f,sid){
  var sc=rateScore(f,sid,'all'),g=f.gesamt||{},d=drv(s,f.id),t=d?team(s,d.team):null;
  var h='<section class="rd" id="rate-detail" style="--tc:'+esc(t?t.color:'#4A505C')+'">'+rdHead(s,f,sc,sid==='all'?'Allgemeine Kritik':'Allgemeine Kritik · '+esc(S(sid).name));
  if(g.kritik) h+='<p class="rd-kurz">'+esc(g.kritik)+'</p>';
  if(sc) h+=rdScores(sc,null);
  h+=rdCols(g.staerken,g.schwaechen,g.fokus,'Stärken','Schwächen','Daran arbeiten');
  (sid==='all'?realSeasons():[S(sid)]).forEach(function(x){
    var rs=sortedRaces(x);if(!rs.length)return;
    h+='<h4 class="rd-h">Rennen '+esc(x.name)+'</h4><div class="rlist">'+rs.map(function(r){

  h+='<p>Platz oder Status je Fahrer wählen. Wer nicht dabei war, bleibt auf „–“. Zeiten sind freiwillig: Abstand wie „+3.214“ oder „+1 Runde“, beste Runde wie „1:19.565“.</p>';

  h+='</tbody></table></div><div class="acts"><button class="btn small" data-act="closeRace">Schließen</button><button class="btn small" data-act="openRace" data-id="'+esc(r.id)+'" data-season="'+esc(s.id)+'">In der Tabelle ansehen</button>'+askBtn('delRace:'+r.id,'Rennen löschen')+'</div></section>';

function qualiEditor(s,r,list,posOpts){
  var q=r.quali||[],count={},warn=[];
  q.forEach(function(x){if(x.p)count[x.p]=(count[x.p]||0)+1;if(x.tm&&!parseT(x.tm))warn.push(dName(s,x.d)+': Zeit im Format 1:18.113 eintragen.');});
  Object.keys(count).forEach(function(p){if(count[p]>1)warn.push('P'+p+' ist '+count[p]+'-mal vergeben.');});
  var best=0;q.forEach(function(x){if(x.p===1)best=parseT(x.tm);});
  var h='<p>Startplatz und Rundenzeit je Fahrer. P1 wird automatisch als Pole mit Pole-Zeit übernommen.</p>'+(warn.length?'<p class="warn">'+warn.map(esc).join(' ')+'</p>':'');
  h+='<div class="tbl-wrap"><table class="res"><thead><tr><th>Fahrer</th><th>Platz</th><th>Rundenzeit</th><th class="num">Abstand</th></tr></thead><tbody>';
  list.forEach(function(id){
    var x=null,e=esc(id);q.forEach(function(y){if(y.d===id)x=y;});
    var ms=x?parseT(x.tm):0;
    h+='<tr><td class="drv">'+esc(dName(s,id))+'</td>'+
      '<td><select id="qp-'+e+'" data-f="q-pos" data-id="'+e+'" aria-label="Startplatz">'+opts(posOpts,x&&x.p?x.p:'')+'</select></td>'+
      '<td><input type="text" class="tin" id="qt-'+e+'" data-f="q-time" data-id="'+e+'" placeholder="1:18.113" value="'+esc(x&&x.tm||'')+'" aria-label="Rundenzeit"></td>'+
      '<td class="num muted">'+(x&&x.p===1?'Pole':(ms&&best?fmtGap(ms-best):''))+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}
function setQuali(r,d,patch){
  r.quali=r.quali||[];var x=null;r.quali.forEach(function(y){if(y.d===d)x=y;});
  if(!x){x={d:d};r.quali.push(x);}
  Object.keys(patch).forEach(function(k){if(patch[k]===''||patch[k]===null)delete x[k];else x[k]=patch[k];});
  if(!x.p&&!x.tm)r.quali=r.quali.filter(function(y){return y!==x;});
  if(!r.quali.length){delete r.quali;return;}
  r.quali.forEach(function(y){if(y.p===1){r.pole=y.d;if(y.tm)r.poleTime=y.tm;}});
}

/* ---------- Änderungen ---------- */
function isDirty(){return JSON.stringify(draft)!==JSON.stringify(DATA);}
function saveStash(){try{if(isDirty())localStorage.setItem('gfl-draft',JSON.stringify(draft));else localStorage.removeItem('gfl-draft');}catch(e){}}
function changed(){saveStash();updateSavebar();var dot=document.querySelector('.tabs a[href="#verwaltung"]');if(dot){var has=dot.querySelector('.dot');if(isDirty()&&!has)dot.insertAdjacentHTML('beforeend','<i class="dot" title="Unveröffentlichte Änderungen"></i>');if(!isDirty()&&has)has.remove();}}
function setRes(s,r,d,patch){
  var x=resOf(r,d);
  if(!x){var dd=drv(s,d);x={d:d,t:dd?dd.team:'',a:true};r.results.push(x);}
  Object.keys(patch).forEach(function(k){if(patch[k]===null||patch[k]==='')delete x[k];else x[k]=patch[k];});
  if(!x.p&&!x.s) r.results=r.results.filter(function(e){return e!==x;});
}
function applyField(f,el){
  if(f.indexOf('imp-')===0){draft.impressum=draft.impressum||{};var ik=f.slice(4),iv=el.value.trim();if(iv)draft.impressum[ik]=iv;else delete draft.impressum[ik];if(!Object.keys(draft.impressum).length)delete draft.impressum;changed();return;}
  var s=S(ui.admSeason);if(!s)return;
  var v=el.type==='checkbox'?el.checked:el.value,id=el.dataset.id,r=null;
  s.races.forEach(function(x){if(x.id===ui.admRace)r=x;});
  var t=id?team(s,id):null,d=id?drv(s,id):null;
  switch(f){
    case 's-name':if(v.trim())s.name=v.trim();break;
    case 's-game':s.game=v.trim();break;
    case 's-points':s.points=v.split(/[^0-9.]+/).filter(Boolean).map(Number);break;
    case 's-fl':s.flPoint=Math.max(0,+v||0);break;
    case 's-pole':s.polePoint=Math.max(0,+v||0);break;
    case 's-clean':s.cleanPoint=Math.max(0,+v||0);break;
    case 's-ot':s.otPoint=Math.max(0,+v||0);break;
    case 's-attend':s.attendPoint=Math.max(0,+v||0);break;
    case 's-fltop':s.flTop10=v;break;
    case 's-demo':s.demo=v;break;
    case 't-name':if(t&&v.trim())t.name=v.trim();break;
    case 't-color':if(t)t.color=v;break;
    case 'd-name':if(d&&v.trim())d.name=v.trim();break;
    case 'd-team':if(d)d.team=v;break;
    case 'd-nat':if(d)d.nat=v;break;
    case 'd-active':if(d)d.active=v;break;
    case 'd-role':if(d)d.role=v;break;
  }
  if(r){
    switch(f){
      case 'r-gp':if(v!==''){var g=GP[+v];r.name=g[1];r.track=g[2];r.flag=g[0];r.short=g[3];}break;
      case 'r-name':if(v.trim())r.name=v.trim();break;
      case 'r-track':r.track=v.trim();break;
      case 'r-short':r.short=v.trim().toUpperCase();break;
      case 'r-flag':r.flag=v;break;
      case 'r-date':r.date=v;break;
      case 'r-dateLabel':r.dateLabel=v.trim();break;
      case 'r-weekend':r.weekend=v?Math.max(1,+v):'';break;
      case 'r-slot':r.slot=v;break;
      case 'r-time':r.time=v;break;
      case 'r-weather':r.weather=v;break;
      case 'r-laps':r.laps=v?Math.max(1,+v):'';break;
      case 'r-poleTime':r.poleTime=v.trim();break;
      case 'r-flTime':r.flTime=v.trim();break;
      case 'r-pole':r.pole=v||null;break;
      case 'r-fl':r.fl=v||null;break;
      case 'r-dotd':r.dotd=v||null;break;
      case 'r-ot':r.ot=v||null;break;
      case 'r-clean':r.clean=v||null;break;
      case 'x-attend':if(resOf(r,id))resOf(r,id).a=v;break;
      case 'x-pos':setRes(s,r,id,v?{p:+v,s:null}:{p:null});break;
      case 'x-status':setRes(s,r,id,v?{s:v,p:null}:{s:null});break;
      case 'x-team':setRes(s,r,id,{t:v});break;
      case 'x-tm':case 'x-bl':{var xx=resOf(r,id),k=f==='x-tm'?'tm':'bl';if(xx){if(v.trim())xx[k]=v.trim();else delete xx[k];}break;}
      case 'q-pos':setQuali(r,id,{p:v?+v:''});break;
      case 'q-time':setQuali(r,id,{tm:v.trim()});break;
    }
    ['pole','fl','dotd','ot','clean'].forEach(function(k){if(!r[k])delete r[k];});
  }
  changed();
  if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='radio'||f==='r-date'||f==='r-poleTime'||f==='r-flTime'||f==='q-time') render();
}
function doAction(act,el){

    case 'cat':ui.cat=id;ui.race='all';break;
    case 'race':ui.race=id;break;
    case 'sess':ui.sess=id;break;

    case 'rec':ui.rec=id;break;
    case 'rate':ui.rate=ui.rate===id?null:id;ui.rateScroll=!!ui.rate;break;

    case 'newSeason':{
      var base=S(ui.admSeason)||draft.seasons[0];
      var ns={id:uid(),name:'Saison '+(draft.seasons.filter(function(x){return !x.demo;}).length+1),game:base?base.game:'F1 26',demo:false,
        points:base?base.points.slice():[25,18,15,12,10,8,6,4,2,1],flPoint:base?base.flPoint:1,flTop10:base?!!base.flTop10:true,polePoint:base?base.polePoint:0,
        teams:base?clone(base.teams):[],drivers:base?clone(base.drivers.filter(function(d){return d.active!==false;})):[],races:[]};
      draft.seasons.unshift(ns);ui.admSeason=ns.id;ui.admRace=null;changed();break;}
    case 'addTeam':s=S(ui.admSeason);if(s){var nt={id:uid(),name:'Neues Team',color:'#8E95A2'};s.teams.push(nt);changed();render();var el1=document.getElementById('tn-'+nt.id);if(el1){el1.focus();el1.select();}return;}break;
    case 'delTeam':s=S(ui.admSeason);if(s&&!usedTeam(s,id)){s.teams=s.teams.filter(function(t){return t.id!==id;});s.drivers.forEach(function(d){if(d.team===id)d.team='';});changed();}break;
    case 'addDriver':s=S(ui.admSeason);if(s){var nd={id:uid(),name:'Neuer Fahrer',team:'',nat:'',active:true};s.drivers.push(nd);changed();render();var el2=document.getElementById('dn-'+nd.id);if(el2){el2.focus();el2.select();}return;}break;
    case 'delDriver':s=S(ui.admSeason);if(s&&!usedDriver(s,id)){s.drivers=s.drivers.filter(function(d){return d.id!==id;});changed();}break;
    case 'addRace':{
      s=S(ui.admSeason);if(!s)break;
      var rs=sortedRaces(s),last=rs[rs.length-1],used={};s.races.forEach(function(x){used[x.name]=1;});
      var g=GP.filter(function(x){return !used[x[1]];})[0]||GP[0];
      var date=today();if(last&&last.date){var dt=new Date(last.date+'T12:00:00');dt.setDate(dt.getDate()+7);date=dt.toISOString().slice(0,10);}
      var nr={id:uid(),name:g[1],short:g[3],flag:g[0],track:g[2],date:date,time:last&&last.time?last.time:'',weather:'',laps:last&&last.laps?last.laps:'',results:[]};
      if(last&&last.slot){
        if(last.slot==='R1'){nr.slot='R2';nr.weekend=last.weekend;nr.date=last.date;nr.dateLabel=last.dateLabel||'';}
        else{nr.slot='R1';nr.weekend=(+last.weekend||0)+1;nr.dateLabel='';}
      }
      s.races.push(nr);ui.admRace=nr.id;changed();break;}
    case 'editRace':ui.admRace=ui.admRace===id?null:id;ui.confirm=null;break;
    case 'closeRace':ui.admRace=null;break;
    case 'ask':ui.confirm=el.dataset.key||null;break;
    case 'do':{
      var key=el.dataset.key||'',parts=key.split(':');ui.confirm=null;
      if(parts[0]==='delSeason'){draft.seasons=draft.seasons.filter(function(x){return x.id!==parts[1];});ui.admSeason=draft.seasons[0]?draft.seasons[0].id:null;ui.admRace=null;if(!S(ui.season))ui.season=defaultSeason();}
      if(parts[0]==='delRace'){s=S(ui.admSeason);if(s)s.races=s.races.filter(function(x){return x.id!==parts[1];});ui.admRace=null;if(ui.race===parts[1])ui.race='all';}
      if(parts[0]==='discard'){draft=clone(DATA);ui.admRace=null;if(!S(ui.season))ui.season=defaultSeason();if(!S(ui.admSeason))ui.admSeason=ui.season;}
      if(parts[0]==='jsonApply'){
        try{var nd2=JSON.parse(ui.json);if(!nd2||!Array.isArray(nd2.seasons))throw 0;draft=nd2;ui.season=defaultSeason();ui.admSeason=ui.season;ui.admRace=null;ui.msg='JSON übernommen. Prüfe die Daten und lade dann daten.json herunter.';}
        catch(e){ui.msg='Das JSON konnte nicht gelesen werden. Es braucht ein Feld "seasons" mit einer Liste.';}
      }
      changed();break;}
    case 'restore':try{draft=JSON.parse(ui.stash);}catch(e){}ui.stash=null;if(!S(ui.season))ui.season=defaultSeason();if(!S(ui.admSeason))ui.admSeason=ui.season;changed();break;

      var ta=document.getElementById('json-io');ui.json=ta?ta.value:ui.json;
      var p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(ui.json):Promise.reject();
      p.then(function(){ui.msg='JSON kopiert.';updateSavebar();},function(){if(ta){ta.focus();ta.select();}ui.msg='Kopieren ging nicht. Der Text ist markiert, kopiere ihn mit Strg+C.';updateSavebar();});
      return;}
    case 'download':download();return;
    case 'save':saveRemote(false);return;
    case 'saveForce':saveRemote(true);return;
    case 'reloadRemote':reloadRemote();return;
    case 'logout':logout();return;
  }
  if(NAV[act])navRender();else render();
}
var NAV={season:1,cat:1,race:1,sess:1,rec:1,admSeason:1,rSeason:1,rRace:1,rateRace:1};

/* ---------- GitHub: Login und Speichern ----------
   Die Owner melden sich mit einem eigenen GitHub-Zugangsschlüssel an. Der Schlüssel bleibt in ihrem Browser;
   gespeichert wird daten.json direkt im Projekt über die GitHub-API. */
var REPO='Bimischi/germanformulaleague',GH='https://api.github.com/repos/'+REPO;
var auth={token:'',user:'',sha:''};
function ghFetch(url,opts){
  opts=opts||{};
  var h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(auth.token)h['Authorization']='Bearer '+auth.token;
  if(opts.body)h['Content-Type']='application/json';
  opts.headers=h;opts.cache='no-store';
  return fetch(url,opts);
}
function b64enc(str){var b=new TextEncoder().encode(str),s='';for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function b64dec(s){var bin=atob(String(s).replace(/\s/g,'')),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b);}
function forgetToken(){try{localStorage.removeItem('gfl-token');sessionStorage.removeItem('gfl-token');}catch(e){}}
function storeToken(t,remember){forgetToken();try{(remember?localStorage:sessionStorage).setItem('gfl-token',t);}catch(e){}}
function storedToken(){try{return localStorage.getItem('gfl-token')||sessionStorage.getItem('gfl-token')||'';}catch(e){return '';}}
function loadRemote(){
  return ghFetch(GH+'/contents/daten.json?ref=main').then(function(r){if(!r.ok)throw new Error('load');return r.json();}).then(function(j){
    var d=JSON.parse(b64dec(j.content));
    if(!d||!Array.isArray(d.seasons))throw new Error('format');
    var keep=isDirty()?draft:null;
    auth.sha=j.sha;DATA=d;draft=keep||clone(DATA);
  });
}
function login(token,remember,silent){
  token=String(token||'').trim();
  if(!token){ui.loginMsg='Bitte füge deinen Zugangsschlüssel ein.';render();return;}
  ui.busy=true;ui.loginMsg=silent?'':'Prüfe den Schlüssel …';if(!silent)render();
  auth.token=token;
  ghFetch(GH).then(function(r){
    if(r.status===401)throw new Error('bad');
    if(!r.ok)throw new Error('repo');
    /* Classic Token: Rechte stehen im Header. Ohne public_repo oder repo darf der Schlüssel nichts speichern. */
    var scopes=r.headers.get('x-oauth-scopes');
    if(scopes!==null&&!/(^|[\s,])(public_repo|repo)([\s,]|$)/.test(scopes))throw new Error('scope');
    return r.json();
  }).then(function(repo){
    if(!repo.permissions||!repo.permissions.push)throw new Error('perm');
    return ghFetch('https://api.github.com/user').then(function(r){return r.ok?r.json():{};}).then(function(u){auth.user=u.login||'';});
  }).then(loadRemote).then(function(){
    storeToken(token,remember);ui.busy=false;ui.loginMsg='';checkStash();
    if(!S(ui.season))ui.season=defaultSeason();
    if(!S(ui.admSeason))ui.admSeason=ui.season;
    render();
  }).catch(function(e){
    auth.token='';auth.user='';ui.busy=false;
    var m=e&&e.message;
    if(silent){if(m==='bad'||m==='perm'||m==='scope')forgetToken();render();return;}
    ui.loginMsg=m==='bad'?'Der Schlüssel ist ungültig oder abgelaufen.':
      m==='scope'?'Dieser Schlüssel darf nur lesen. Erstelle einen neuen Classic Token und setze dabei das Häkchen bei „public_repo“ (Link unten).':
      m==='perm'?'Dieser Schlüssel darf das GFL-Projekt nicht ändern. Prüfe den Projektzugriff und die Schreibrechte (Contents: Read and write).':
      m==='repo'?'Mit diesem Schlüssel ist das GFL-Projekt nicht erreichbar. Wähle beim Erstellen das Projekt germanformulaleague aus.':
      'Die Anmeldung hat nicht geklappt. Prüfe deine Internetverbindung und versuche es noch einmal.';
    render();
  });
}
function logout(){auth.token='';auth.user='';auth.sha='';forgetToken();ui.msg='';ui.conflict=false;draft=clone(DATA);go('tabelle');}
function saveRemote(force){
  if(ui.busy||!auth.token)return;
  ui.busy=true;ui.msg='Wird gespeichert …';updateSavebar();
  var pre=force?ghFetch(GH+'/contents/daten.json?ref=main').then(function(r){if(!r.ok)throw new Error('fail');return r.json();}).then(function(j){auth.sha=j.sha;}):Promise.resolve();
  pre.then(function(){
    return ghFetch(GH+'/contents/daten.json',{method:'PUT',body:JSON.stringify({
      message:'Daten aktualisiert über die Verwaltung'+(auth.user?' ('+auth.user+')':''),
      content:b64enc(JSON.stringify(draft,null,1)+'\n'),sha:auth.sha,branch:'main'})});
  }).then(function(r){
    if(r.status===409||r.status===422)throw new Error('conflict');
    if(r.status===401)throw new Error('auth');
    if(r.status===403||r.status===404)throw new Error('write');
    if(!r.ok)throw new Error('fail');
    return r.json();
  }).then(function(j){
    auth.sha=j.content.sha;DATA=clone(draft);saveStash();ui.busy=false;ui.conflict=false;
    ui.msg='Gespeichert. Die öffentliche Seite ist in etwa einer Minute aktuell.';render();
  }).catch(function(e){
    ui.busy=false;var m=e&&e.message;
    if(m==='conflict'){ui.conflict=true;ui.msg='Jemand anderes hat in der Zwischenzeit gespeichert. Lade den neuesten Stand oder überschreibe ihn mit deiner Version.';}
    else if(m==='auth')ui.msg='Dein Schlüssel ist abgelaufen. Erstelle einen neuen und melde dich neu an. Deine Änderungen bleiben in diesem Browser erhalten.';
    else if(m==='write')ui.msg='Dein Schlüssel darf nur lesen, nicht speichern. Erstelle einen Classic Token mit Häkchen bei „public_repo“, melde dich ab und mit dem neuen Schlüssel wieder an. Deine Änderungen bleiben in diesem Browser erhalten.';
    else ui.msg='Speichern hat nicht geklappt. Versuche es gleich noch einmal.';
    updateSavebar();
  });
}
function reloadRemote(){
  draft=clone(DATA);ui.conflict=false;ui.msg='Lade den neuesten Stand …';updateSavebar();
  loadRemote().then(function(){draft=clone(DATA);saveStash();ui.msg='Neuester Stand geladen. Deine Änderungen von eben sind verworfen.';render();},
    function(){ui.msg='Der neueste Stand konnte nicht geladen werden.';updateSavebar();});
}

/* ---------- Sicherung als Datei ---------- */
function download(){
  try{
    var blob=new Blob([JSON.stringify(draft,null,1)+'\n'],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daten.json';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
    ui.msg='daten.json ist heruntergeladen. Ersetze damit die Datei im GitHub-Projekt, dann ist die Seite in etwa einer Minute aktuell.';
  }catch(e){ui.msg='Herunterladen ging nicht. Kopiere die Daten unter „Sicherung“.';}
  updateSavebar();
}
function updateSavebar(){
  var slot=document.getElementById('savebar-slot');if(!slot)return;
  var dirty=isDirty()&&!!auth.token;
  if(!dirty&&!ui.msg){slot.innerHTML='';return;}
  var acts;
  if(ui.conflict&&auth.token) acts='<button class="btn small" data-act="reloadRemote">Neuesten Stand laden</button><button class="btn primary" data-act="saveForce"'+(ui.busy?' disabled':'')+'>Meine Version speichern</button>';
  else if(dirty) acts=(ui.confirm==='discard'?'<span class="confirm">Alle Änderungen verwerfen? <button class="btn small danger" data-act="do" data-key="discard">Ja, verwerfen</button><button class="btn small" data-act="ask" data-key="">Abbrechen</button></span>':'<button class="btn small" data-act="ask" data-key="discard">Verwerfen</button>')+
    '<button class="btn primary" data-act="save"'+(ui.busy?' disabled':'')+'>Speichern &amp; veröffentlichen</button>';
  else acts='<button class="btn small" data-act="clearMsg">OK</button>';
  slot.innerHTML='<div class="savebar" role="region" aria-label="Speichern"><div class="savebar-in"><p role="status">'+(ui.msg?esc(ui.msg):'Ungespeicherte Änderungen. Alle anderen sehen sie erst nach dem Speichern.')+'</p><div class="acts">'+acts+'</div></div></div>';
}

/* ---------- Rendern ---------- */
function footer(){
  var s=S(ui.season);
  return '<footer class="foot"><div class="foot-in"><span>German Formula League · <a href="#verwaltung">'+(auth.token?'Verwaltung'+(auth.user?' ('+esc(auth.user)+')':''):'Login Liga-Leitung')+'</a> · <a href="#impressum">Impressum</a> · <a href="#datenschutz">Datenschutz</a>'+footSocials()+'</span>'+(s?'<span>Punkte '+esc(s.name)+': '+esc(pointsText(s))+'</span>':'')+'</div></footer>';
}
function render(anim){
  var a=document.activeElement,fid=a&&a.id;
  if(!S(ui.season))ui.season=defaultSeason();
  var v=ui.view;
  var body=v==='kalender'?viewKalender():v==='bewertung'?viewBewertung():v==='rekorde'?viewRekorde():v==='socials'?viewSocials():v==='fahrer'?viewFahrer():v==='verwaltung'?viewAdmin():v==='impressum'?viewImpressum():v==='datenschutz'?viewDatenschutz():viewTabelle();
  document.getElementById('app').innerHTML=header()+'<main class="wrap'+(anim?' enter':'')+'">'+body+'</main>'+footer()+'<div id="savebar-slot"></div>';
  updateSavebar();
  if(ui.rateScroll&&v==="bewertung"){ui.rateScroll=false;setTimeout(function(){var rd=document.getElementById("rate-detail");if(rd)rd.scrollIntoView({behavior:"smooth",block:"start"});},40);}
  if(fid){var el=document.getElementById(fid);if(el)try{el.focus({preventScroll:true});}catch(e){}}
}
/* Weiche Überblendung beim Wechsel von Ansicht, Saison, Wertung oder Rennen */
function navRender(){
  render(true);
}
var VIEWS=['tabelle','kalender','fahrer','bewertung','rekorde','socials','verwaltung','impressum','datenschutz'];
function readHash(){var h=location.hash.replace('#','');ui.view=VIEWS.indexOf(h)>=0?h:'tabelle';}
window.addEventListener('hashchange',function(){var before=ui.view;readHash();if(before!==ui.view){navRender();window.scrollTo(0,0);}});
function go(view){
  var before=ui.view;ui.view=VIEWS.indexOf(view)>=0?view:'tabelle';
  try{if(location.hash!=='#'+ui.view)location.hash=ui.view;}catch(e){}
  if(before!==ui.view){navRender();window.scrollTo(0,0);}else render();
}
document.addEventListener('click',function(e){
  var a=e.target.closest('a[href^="#"]');
  if(a){var v=a.getAttribute('href').slice(1);if(VIEWS.indexOf(v)>=0){e.preventDefault();go(v);return;}}
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.dataset.act;
  if(act==='clearMsg'){ui.msg='';updateSavebar();return;}
  if(act!=='download'&&act!=='jsonCopy'&&!ui.busy)ui.msg='';
  doAction(act,el);
});
document.addEventListener('submit',function(e){
  if(e.target&&e.target.id==='login-form'){
    e.preventDefault();
    var t=document.getElementById('login-token'),rm=document.getElementById('login-remember');
    login(t?t.value:'',rm?rm.checked:true,false);
  }
});
document.addEventListener('change',function(e){var el=e.target;if(el&&el.dataset&&el.dataset.f)applyField(el.dataset.f,el);});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='json-io')ui.json=e.target.value;});

function checkStash(){
  try{var raw=localStorage.getItem('gfl-draft');if(!raw)return;
    if(raw===JSON.stringify(DATA)){localStorage.removeItem('gfl-draft');return;}
    ui.stash=raw;}catch(e){}
}
function load(){
  fetch('daten.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){
    if(!d||!Array.isArray(d.seasons))throw new Error('format');
    DATA=d;draft=clone(DATA);
    ui.season=defaultSeason();ui.admSeason=ui.season;
    readHash();render();showNotice();
    fetch("bewertung.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(b){if(b&&b.fahrer){RATE=b;if(ui.view!=="verwaltung")render();}}).catch(function(){});
    var tok=storedToken();
    if(tok){var remember=false;try{remember=!!localStorage.getItem('gfl-token');}catch(e){}login(tok,remember,true);}
  }).catch(function(){
    document.getElementById('app').innerHTML='<p class="loading">Die Ergebnisse konnten nicht geladen werden. Lade die Seite bitte neu.</p>';
  });
}
load();
})();
</script>
</body>
